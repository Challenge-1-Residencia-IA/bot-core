name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - run: ruff check --output-format=github .

  testes:
    name: Testes (com Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Os testes não usam LLM, rede nem navegador; o banco é o serviço acima, descartável.
      GUARDRAILS_NEMO: "0"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/challenge1
      DATABASE_URL: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            conectores/whatsapp/requirements.txt
      - name: Instalar dependências
        run: |
          # PyTorch só para CPU: o sentence-transformers puxaria a versão com CUDA (~2 GB) sem isto.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r conectores/whatsapp/requirements.txt
      - name: Testes
        run: python -m pytest -q -rs
